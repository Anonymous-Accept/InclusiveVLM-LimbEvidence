version: prosthesis_match_prompt_bank_v2
language: en
task: Prosthesis Matching (benchmark-defined compatibility-style visual option matching)

# Frozen version policy:
# - This prompt bank is frozen and versioned; bump `version` (e.g., v3) when adding or modifying prompts.
# - Items are built offline: the builder selects a template_id from this bank (by seed) and writes it into each item.
# - Inference only reads the template_id already embedded in items; no runtime prompt sampling.
# - Automatic generation is for offline expansion only; freeze into a new version before official benchmarking.

# v2 Changes:
# - Support variable number of correct answers (0-8, where 8 = all options match)
# - Output format changed to JSON array: {"choices": ["A", "B"]} or {"choices": []} for none
# - Prompts updated to reflect that zero, one, or multiple options may match

output_contract:
  format: json_one_line
  schema:
    choices: OPTION_ID_ARRAY
  allowed_choice_placeholder: "{ALLOWED_CHOICES}"
  rules:
    - Return exactly one JSON object on a single line.
    - Do not use markdown fences.
    - Do not include any text outside JSON.
    - Zero or more options may match the visible limb deficiency.
    - 'If no option matches, return {"choices": []}.'
    - 'If one option matches, return {"choices": ["X"]}.'
    - If multiple options match, return all matching IDs.
  allow_zero_matches: true
  allow_multiple_matches: true
  example_none: '{"choices":[]}'
  example_single: '{"choices":["B"]}'
  example_multiple: '{"choices":["A","C","F"]}'

placeholders:
  ALLOWED_CHOICES: Comma-separated option IDs, e.g., A,B,C,D,E,F,G,H
  OPTION_LIST: Rendered in the user prompt with IDs and (option images or brief text).
prompts:
  - id: pos_select_001
    text: 'Select all prosthesis options that match the affected limb region visible in the person image. Use only what you can see. There may be zero, one, or multiple matching options. Reply as one-line JSON: {{"choices":["A","B"]}} or {{"choices":[]}} if none match.'
  - id: pos_select_002
    text: 'From the option images, pick all prostheses that match the benchmark-defined visible evidence in the person image. If none match, return an empty list. Output only JSON: {{"choices":["A"]}} or {{"choices":[]}}.'
  - id: pos_select_003
    text: Look at the person image. Choose all options whose limb region (arm/leg, upper/lower) matches the visible affected or residual limb. Return JSON with a list of matching option IDs, or an empty list if none match.
  - id: pos_select_004
    text: Match the person image to prosthesis options. The match is based on limb segment (upper/lower arm or upper/lower leg). Pick all matching option IDs. Output JSON only.
  - id: pos_select_005
    text: Choose all prosthesis options that align with the visible affected limb region in the person image. Use visible cues only. Return all matches as a JSON array, or empty array if none.
  - id: pos_select_006
    text: 'Identify the affected limb region shown. Then select all options belonging to that same segment category. Reply with JSON only: {{"choices":["A","C"]}} or {{"choices":[]}}.'
  - id: pos_select_007
    text: Pick all options that match the benchmark-defined visible evidence for the limb difference. If none match, return an empty list. Output a single-line JSON object.
  - id: pos_select_008
    text: Based on the person image, select all prosthesis options that match the affected limb segment. Do not add explanations. Return JSON with choices array.
  - id: pos_select_009
    text: Choose all prosthesis options that correspond to the visible residual limb level (segment category only). If no options match, return empty list. JSON only.
  - id: pos_select_010
    text: Select all matching prosthesis options for the affected limb region in the person image. Use only visible evidence. Output JSON with choices array.
  - id: pos_select_011
    text: From options A–H, choose all that match the limb region visible as affected or residual. If none match, return empty list. Respond with JSON only.
  - id: pos_select_012
    text: Decide which limb segment is affected in the person image (arm/leg and upper/lower). Choose all options with the same segment label. Output JSON only.
  - id: pos_select_013
    text: Pick all option IDs whose prosthesis segment matches the visible limb deficiency. No extra words. JSON only with choices array.
  - id: pos_select_014
    text: Choose all options that match the visible limb segment difference. Return JSON array with all matches, or empty array if none. JSON only.
  - id: pos_select_015
    text: Select all prosthesis options that match the affected limb region shown. Do not infer anything not visible. Reply with JSON choices array.
  - id: pos_select_016
    text: Look only at visible cues. Choose all options that match the affected limb region. Output JSON with list of matching IDs or empty list.
  - id: pos_select_017
    text: Choose all options that match the affected limb segment in the image. Return {{"choices":["A","B"]}} format. Empty list if no match.
  - id: pos_select_018
    text: Pick all options that match the affected or residual limb-region category. JSON array format, empty if none match.
  - id: pos_select_019
    text: Select all prosthesis options that best match the affected limb region seen. No explanation. JSON choices array only.
  - id: pos_select_020
